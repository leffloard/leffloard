name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # her 12 saatte bir yeniden üret
  workflow_dispatch:          # Actions sekmesinden elle çalıştırabilmek için
  push:
    branches: [main]

permissions:
  contents: write             # output branch'ine push edebilmek için

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svgs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#3b0764,#5b21b6,#7c3aed,#c084fc

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
